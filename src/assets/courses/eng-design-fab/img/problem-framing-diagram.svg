<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 900 330" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <marker id="pf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="white" />
    </marker>
  </defs>

  <!-- 1 User -->
  <rect x="30" y="20" width="180" height="70" rx="10" fill="none" stroke="white" stroke-width="3" />
  <text x="120" y="60" text-anchor="middle" fill="white" font-size="20" font-family="sans-serif">1 User</text>

  <!-- 2 Need -->
  <rect x="250" y="20" width="180" height="70" rx="10" fill="none" stroke="white" stroke-width="3" />
  <text x="340" y="60" text-anchor="middle" fill="white" font-size="20" font-family="sans-serif">2 Need</text>

  <!-- 3 Constraints -->
  <rect x="470" y="20" width="180" height="70" rx="10" fill="none" stroke="white" stroke-width="3" />
  <text x="560" y="60" text-anchor="middle" fill="white" font-size="20" font-family="sans-serif">3 Constraints</text>

  <!-- 4 Success Criteria -->
  <rect x="690" y="20" width="180" height="70" rx="10" fill="none" stroke="white" stroke-width="3" />
  <text x="780" y="53" text-anchor="middle" fill="white" font-size="20" font-family="sans-serif">4 Success</text>
  <text x="780" y="76" text-anchor="middle" fill="white" font-size="20" font-family="sans-serif">Criteria</text>

  <!-- Converging arrows -->
  <line x1="120" y1="90" x2="410" y2="228" stroke="white" stroke-width="3" marker-end="url(#pf-arrow)" />
  <line x1="340" y1="90" x2="430" y2="228" stroke="white" stroke-width="3" marker-end="url(#pf-arrow)" />
  <line x1="560" y1="90" x2="470" y2="228" stroke="white" stroke-width="3" marker-end="url(#pf-arrow)" />
  <line x1="780" y1="90" x2="490" y2="228" stroke="white" stroke-width="3" marker-end="url(#pf-arrow)" />

  <!-- Problem Statement -->
  <rect x="320" y="230" width="260" height="70" rx="10" fill="none" stroke="rgb(27,212,215)" stroke-width="4" />
  <text x="450" y="272" text-anchor="middle" fill="rgb(27,212,215)" font-size="22" font-family="sans-serif">Problem Statement</text>

  <text x="450" y="320" text-anchor="middle" fill="rgb(27,212,215)" font-size="17" font-family="sans-serif">All four parts converge into one precise statement</text>
</svg>
