<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 900 280" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <marker id="cycle-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="white" />
    </marker>
    <marker id="cycle-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgb(27,212,215)" />
    </marker>
  </defs>

  <!-- 1 Define -->
  <rect x="20" y="20" width="120" height="70" rx="10" fill="none" stroke="white" stroke-width="3" />
  <text x="80" y="60" text-anchor="middle" fill="white" font-size="20" font-family="sans-serif">1 Define</text>

  <line x1="140" y1="55" x2="166" y2="55" stroke="white" stroke-width="3" marker-end="url(#cycle-arrow)" />

  <!-- 2 Design -->
  <rect x="166" y="20" width="120" height="70" rx="10" fill="none" stroke="white" stroke-width="3" />
  <text x="226" y="60" text-anchor="middle" fill="white" font-size="20" font-family="sans-serif">2 Design</text>

  <line x1="286" y1="55" x2="312" y2="55" stroke="white" stroke-width="3" marker-end="url(#cycle-arrow)" />

  <!-- 3 Build -->
  <rect x="312" y="20" width="120" height="70" rx="10" fill="none" stroke="white" stroke-width="3" />
  <text x="372" y="60" text-anchor="middle" fill="white" font-size="20" font-family="sans-serif">3 Build</text>

  <line x1="432" y1="55" x2="458" y2="55" stroke="white" stroke-width="3" marker-end="url(#cycle-arrow)" />

  <!-- 4 Test -->
  <rect x="458" y="20" width="120" height="70" rx="10" fill="none" stroke="white" stroke-width="3" />
  <text x="518" y="60" text-anchor="middle" fill="white" font-size="20" font-family="sans-serif">4 Test</text>

  <line x1="578" y1="55" x2="604" y2="55" stroke="white" stroke-width="3" marker-end="url(#cycle-arrow)" />

  <!-- 5 Iterate -->
  <rect x="604" y="20" width="120" height="70" rx="10" fill="none" stroke="white" stroke-width="3" />
  <text x="664" y="60" text-anchor="middle" fill="white" font-size="20" font-family="sans-serif">5 Iterate</text>

  <line x1="724" y1="55" x2="750" y2="55" stroke="white" stroke-width="3" marker-end="url(#cycle-arrow)" />

  <!-- 6 Reflect -->
  <rect x="750" y="20" width="120" height="70" rx="10" fill="none" stroke="white" stroke-width="3" />
  <text x="810" y="60" text-anchor="middle" fill="white" font-size="20" font-family="sans-serif">6 Reflect</text>

  <!-- Loop back: Reflect feeds into Define -->
  <path d="M 810 90 C 810 220 80 220 80 90" fill="none" stroke="rgb(27,212,215)" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#cycle-arrow-accent)" />
  <text x="445" y="255" text-anchor="middle" fill="rgb(27,212,215)" font-size="18" font-family="sans-serif">Reflect feeds back into Define — a loop, not a checklist</text>
</svg>
