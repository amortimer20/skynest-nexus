<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 900 320" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Good stepover -->
  <rect x="60" y="30" width="330" height="200" rx="6" fill="none" stroke="white" stroke-width="3" />
  <g stroke="rgb(27,212,215)" stroke-width="6" stroke-linecap="round">
    <line x1="80" y1="55" x2="370" y2="55" />
    <line x1="370" y1="80" x2="80" y2="80" />
    <line x1="80" y1="105" x2="370" y2="105" />
    <line x1="370" y1="130" x2="80" y2="130" />
    <line x1="80" y1="155" x2="370" y2="155" />
    <line x1="370" y1="180" x2="80" y2="180" />
    <line x1="80" y1="205" x2="370" y2="205" />
  </g>
  <text x="225" y="255" text-anchor="middle" fill="rgb(27,212,215)" font-size="18" font-family="sans-serif">Even step-over</text>
  <text x="225" y="278" text-anchor="middle" fill="white" font-size="14" font-family="sans-serif">Passes overlap enough to clear everything</text>

  <!-- Bad stepover -->
  <rect x="500" y="30" width="330" height="200" rx="6" fill="none" stroke="white" stroke-width="3" />
  <g stroke="rgb(27,212,215)" stroke-width="6" stroke-linecap="round">
    <line x1="520" y1="55" x2="810" y2="55" />
    <line x1="810" y1="100" x2="520" y2="100" />
    <line x1="520" y1="145" x2="810" y2="145" />
    <line x1="810" y1="190" x2="520" y2="190" />
  </g>
  <g stroke="white" stroke-width="2" stroke-dasharray="4,4">
    <line x1="520" y1="77" x2="810" y2="77" />
    <line x1="520" y1="122" x2="810" y2="122" />
    <line x1="520" y1="167" x2="810" y2="167" />
  </g>
  <text x="665" y="255" text-anchor="middle" fill="rgb(27,212,215)" font-size="18" font-family="sans-serif">Step-over too wide</text>
  <text x="665" y="278" text-anchor="middle" fill="white" font-size="14" font-family="sans-serif">Dashed ridges of uncut material remain</text>

  <text x="450" y="310" text-anchor="middle" fill="white" font-size="15" font-family="sans-serif">Step-over is the distance between adjacent passes — set relative to the tool's diameter</text>
</svg>
