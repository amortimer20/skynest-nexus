<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 900 300" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Profile -->
  <rect x="40" y="30" width="220" height="160" rx="6" fill="none" stroke="white" stroke-width="3" />
  <rect x="55" y="45" width="190" height="130" rx="4" fill="none" stroke="rgb(27,212,215)" stroke-width="4" stroke-dasharray="10,6" />
  <text x="150" y="225" text-anchor="middle" fill="rgb(27,212,215)" font-size="20" font-family="sans-serif">Profile</text>
  <text x="150" y="250" text-anchor="middle" fill="white" font-size="14" font-family="sans-serif">Cuts along the outline</text>

  <!-- Pocket -->
  <rect x="340" y="30" width="220" height="160" rx="6" fill="none" stroke="white" stroke-width="3" />
  <g stroke="rgb(27,212,215)" stroke-width="3">
    <line x1="355" y1="50" x2="545" y2="50" />
    <line x1="545" y1="65" x2="355" y2="65" />
    <line x1="355" y1="80" x2="545" y2="80" />
    <line x1="545" y1="95" x2="355" y2="95" />
    <line x1="355" y1="110" x2="545" y2="110" />
    <line x1="545" y1="125" x2="355" y2="125" />
    <line x1="355" y1="140" x2="545" y2="140" />
    <line x1="545" y1="155" x2="355" y2="155" />
    <line x1="355" y1="170" x2="545" y2="170" />
  </g>
  <text x="450" y="225" text-anchor="middle" fill="rgb(27,212,215)" font-size="20" font-family="sans-serif">Pocket</text>
  <text x="450" y="250" text-anchor="middle" fill="white" font-size="14" font-family="sans-serif">Clears out an interior area</text>

  <!-- Drill -->
  <rect x="640" y="30" width="220" height="160" rx="6" fill="none" stroke="white" stroke-width="3" />
  <circle cx="750" cy="110" r="14" fill="none" stroke="rgb(27,212,215)" stroke-width="4" />
  <circle cx="750" cy="110" r="2.5" fill="rgb(27,212,215)" />
  <text x="750" y="225" text-anchor="middle" fill="rgb(27,212,215)" font-size="20" font-family="sans-serif">Drill</text>
  <text x="750" y="250" text-anchor="middle" fill="white" font-size="14" font-family="sans-serif">Plunges straight down at a point</text>

  <text x="450" y="285" text-anchor="middle" fill="white" font-size="15" font-family="sans-serif">The same three toolpath types cover almost every 2.5-axis CNC job</text>
</svg>
