<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 900 320" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <marker id="sd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgb(27,212,215)" />
    </marker>
  </defs>

  <!-- Material cross-section -->
  <rect x="150" y="40" width="500" height="220" fill="none" stroke="white" stroke-width="3" />
  <text x="400" y="30" text-anchor="middle" fill="white" font-size="16" font-family="sans-serif">Material (side view)</text>

  <!-- Depth pass lines -->
  <line x1="150" y1="90" x2="650" y2="90" stroke="rgb(27,212,215)" stroke-width="3" stroke-dasharray="8,5" />
  <text x="670" y="95" fill="rgb(27,212,215)" font-size="16" font-family="sans-serif">Pass 1</text>

  <line x1="150" y1="140" x2="650" y2="140" stroke="rgb(27,212,215)" stroke-width="3" stroke-dasharray="8,5" />
  <text x="670" y="145" fill="rgb(27,212,215)" font-size="16" font-family="sans-serif">Pass 2</text>

  <line x1="150" y1="190" x2="650" y2="190" stroke="rgb(27,212,215)" stroke-width="3" stroke-dasharray="8,5" />
  <text x="670" y="195" fill="rgb(27,212,215)" font-size="16" font-family="sans-serif">Pass 3</text>

  <line x1="150" y1="240" x2="650" y2="240" stroke="white" stroke-width="4" />
  <text x="670" y="245" fill="white" font-size="16" font-family="sans-serif">Final depth</text>

  <!-- Step-down arrow -->
  <line x1="120" y1="90" x2="120" y2="140" stroke="rgb(27,212,215)" stroke-width="3" marker-end="url(#sd-arrow)" marker-start="url(#sd-arrow)" />
  <text x="100" y="120" text-anchor="end" fill="rgb(27,212,215)" font-size="15" font-family="sans-serif">step-down</text>

  <text x="400" y="300" text-anchor="middle" fill="white" font-size="15" font-family="sans-serif">Several shallow passes instead of one full-depth plunge — protects the tool and the cut</text>
</svg>
