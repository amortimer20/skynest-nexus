<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 900 320" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <marker id="cc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="white" />
    </marker>
  </defs>

  <!-- Concept A/B/C -->
  <rect x="40" y="20" width="160" height="60" rx="10" fill="none" stroke="white" stroke-width="3" />
  <text x="120" y="57" text-anchor="middle" fill="white" font-size="20" font-family="sans-serif">Concept A</text>

  <rect x="40" y="120" width="160" height="60" rx="10" fill="none" stroke="white" stroke-width="3" />
  <text x="120" y="157" text-anchor="middle" fill="white" font-size="20" font-family="sans-serif">Concept B</text>

  <rect x="40" y="220" width="160" height="60" rx="10" fill="none" stroke="white" stroke-width="3" />
  <text x="120" y="257" text-anchor="middle" fill="white" font-size="20" font-family="sans-serif">Concept C</text>

  <!-- Converge into Decision Matrix -->
  <line x1="200" y1="50" x2="336" y2="145" stroke="white" stroke-width="3" marker-end="url(#cc-arrow)" />
  <line x1="200" y1="150" x2="336" y2="150" stroke="white" stroke-width="3" marker-end="url(#cc-arrow)" />
  <line x1="200" y1="250" x2="336" y2="155" stroke="white" stroke-width="3" marker-end="url(#cc-arrow)" />

  <rect x="340" y="105" width="220" height="90" rx="10" fill="none" stroke="rgb(27,212,215)" stroke-width="4" />
  <text x="450" y="145" text-anchor="middle" fill="rgb(27,212,215)" font-size="20" font-family="sans-serif">Decision</text>
  <text x="450" y="170" text-anchor="middle" fill="rgb(27,212,215)" font-size="20" font-family="sans-serif">Matrix</text>

  <!-- Decision Matrix -> Chosen Concept -->
  <line x1="560" y1="150" x2="646" y2="150" stroke="rgb(27,212,215)" stroke-width="3" marker-end="url(#cc-arrow)" />

  <rect x="650" y="105" width="210" height="90" rx="10" fill="none" stroke="rgb(27,212,215)" stroke-width="4" />
  <text x="755" y="145" text-anchor="middle" fill="rgb(27,212,215)" font-size="20" font-family="sans-serif">Chosen</text>
  <text x="755" y="170" text-anchor="middle" fill="rgb(27,212,215)" font-size="20" font-family="sans-serif">Concept</text>

  <text x="450" y="300" text-anchor="middle" fill="rgb(27,212,215)" font-size="17" font-family="sans-serif">Divergent sketching generates alternatives — the matrix makes choosing between them defensible</text>
</svg>
