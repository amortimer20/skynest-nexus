<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 900 330" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Outside -->
  <rect x="60" y="30" width="180" height="130" fill="none" stroke="white" stroke-width="3" stroke-dasharray="6,5" />
  <rect x="45" y="15" width="210" height="160" fill="none" stroke="rgb(27,212,215)" stroke-width="4" />
  <text x="150" y="200" text-anchor="middle" fill="rgb(27,212,215)" font-size="19" font-family="sans-serif">Outside</text>
  <text x="150" y="225" text-anchor="middle" fill="white" font-size="14" font-family="sans-serif">Cutting out a part:</text>
  <text x="150" y="245" text-anchor="middle" fill="white" font-size="14" font-family="sans-serif">keeps the part full size</text>

  <!-- On-Path -->
  <rect x="345" y="20" width="200" height="150" fill="none" stroke="white" stroke-width="3" stroke-dasharray="6,5" />
  <rect x="345" y="20" width="200" height="150" fill="none" stroke="rgb(27,212,215)" stroke-width="4" />
  <text x="445" y="200" text-anchor="middle" fill="rgb(27,212,215)" font-size="19" font-family="sans-serif">On-Path</text>
  <text x="445" y="225" text-anchor="middle" fill="white" font-size="14" font-family="sans-serif">Splits the difference:</text>
  <text x="445" y="245" text-anchor="middle" fill="white" font-size="14" font-family="sans-serif">off by half the bit's width</text>

  <!-- Inside -->
  <rect x="655" y="15" width="210" height="160" fill="none" stroke="white" stroke-width="3" stroke-dasharray="6,5" />
  <rect x="670" y="30" width="180" height="130" fill="none" stroke="rgb(27,212,215)" stroke-width="4" />
  <text x="760" y="200" text-anchor="middle" fill="rgb(27,212,215)" font-size="19" font-family="sans-serif">Inside</text>
  <text x="760" y="225" text-anchor="middle" fill="white" font-size="14" font-family="sans-serif">Cutting a hole:</text>
  <text x="760" y="245" text-anchor="middle" fill="white" font-size="14" font-family="sans-serif">keeps the hole full size</text>

  <text x="450" y="290" text-anchor="middle" fill="white" font-size="15" font-family="sans-serif">Dashed line = what you drew. Teal line = where the bit's center actually travels.</text>
  <text x="450" y="315" text-anchor="middle" fill="rgb(27,212,215)" font-size="15" font-family="sans-serif">The wrong offset makes an "in-tolerance" model cut an out-of-tolerance real part.</text>
</svg>
