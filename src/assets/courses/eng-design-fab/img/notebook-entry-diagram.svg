<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 520 640" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Page outline -->
  <rect x="20" y="20" width="480" height="600" rx="12" fill="none" stroke="white" stroke-width="3" />

  <!-- Date -->
  <text x="50" y="65" fill="rgb(27,212,215)" font-size="22" font-family="sans-serif">Date:</text>
  <line x1="140" y1="60" x2="470" y2="60" stroke="rgb(27,212,215)" stroke-width="2" />

  <!-- Problem Statement -->
  <text x="50" y="120" fill="rgb(27,212,215)" font-size="22" font-family="sans-serif">Problem Statement</text>
  <rect x="50" y="135" width="420" height="90" rx="6" fill="none" stroke="rgb(27,212,215)" stroke-width="3" />
  <line x1="70" y1="165" x2="440" y2="165" stroke="rgb(27,212,215)" stroke-width="1" opacity="0.5" />
  <line x1="70" y1="190" x2="440" y2="190" stroke="rgb(27,212,215)" stroke-width="1" opacity="0.5" />

  <!-- Sketch -->
  <text x="50" y="260" fill="rgb(27,212,215)" font-size="22" font-family="sans-serif">Sketch</text>
  <rect x="50" y="275" width="420" height="220" rx="6" fill="none" stroke="rgb(27,212,215)" stroke-width="3" />
  <path d="M 150 460 L 200 400 L 240 440 L 300 350 L 370 420" fill="none" stroke="white" stroke-width="2" opacity="0.6" />
  <circle cx="150" cy="460" r="4" fill="white" opacity="0.6" />
  <circle cx="370" cy="420" r="4" fill="white" opacity="0.6" />

  <!-- Notes -->
  <text x="50" y="530" fill="white" font-size="20" font-family="sans-serif">Notes / What Happened</text>
  <rect x="50" y="545" width="420" height="55" rx="6" fill="none" stroke="white" stroke-width="2" opacity="0.6" />

  <text x="260" y="628" text-anchor="middle" fill="rgb(27,212,215)" font-size="16" font-family="sans-serif">The three graded parts of a first entry: dated, statement, sketch</text>
</svg>
