<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="560" height="330" viewBox="0 0 560 330" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <marker id="lt-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgb(255,210,40)" />
    </marker>
  </defs>

  <!-- ============ LEFT: photocell voltage divider ============ -->
  <text x="130" y="24" text-anchor="middle" fill="white" font-size="16" font-family="sans-serif">Light sensor</text>
  <circle cx="130" cy="46" r="5" fill="rgb(27,212,215)" />
  <text x="130" y="40" text-anchor="middle" fill="rgb(27,212,215)" font-size="0" font-family="sans-serif"> </text>
  <text x="96" y="52" text-anchor="end" fill="rgb(27,212,215)" font-size="17" font-family="sans-serif">3V3</text>
  <line x1="130" y1="46" x2="130" y2="70" stroke="white" stroke-width="3" />

  <!-- photocell -->
  <path d="M 130 70 L 112 82 L 148 96 L 112 110 L 148 124 L 130 136" fill="none" stroke="white" stroke-width="3" />
  <line x1="182" y1="78" x2="158" y2="94" stroke="rgb(255,210,40)" stroke-width="2" marker-end="url(#lt-arrow)" />
  <line x1="182" y1="98" x2="158" y2="114" stroke="rgb(255,210,40)" stroke-width="2" marker-end="url(#lt-arrow)" />
  <text x="188" y="86" fill="rgb(255,210,40)" font-size="13" font-family="sans-serif">light</text>
  <text x="60" y="106" text-anchor="end" fill="white" font-size="14" font-family="sans-serif">photocell</text>

  <!-- junction to A2 -->
  <line x1="130" y1="136" x2="130" y2="164" stroke="white" stroke-width="3" />
  <circle cx="130" cy="150" r="5" fill="rgb(27,212,215)" />
  <line x1="130" y1="150" x2="212" y2="150" stroke="rgb(27,212,215)" stroke-width="3" />
  <text x="218" y="146" fill="rgb(27,212,215)" font-size="17" font-family="sans-serif">A2</text>
  <text x="218" y="165" fill="rgb(27,212,215)" font-size="13" font-family="sans-serif">GPIO 42</text>

  <!-- fixed 10K leg -->
  <path d="M 130 164 L 112 176 L 148 190 L 112 204 L 148 218 L 130 230" fill="none" stroke="white" stroke-width="3" />
  <text x="60" y="200" text-anchor="end" fill="white" font-size="14" font-family="sans-serif">10K</text>

  <line x1="130" y1="230" x2="130" y2="252" stroke="white" stroke-width="3" />
  <line x1="110" y1="252" x2="150" y2="252" stroke="white" stroke-width="3" />
  <line x1="116" y1="262" x2="144" y2="262" stroke="white" stroke-width="3" />
  <line x1="122" y1="272" x2="138" y2="272" stroke="white" stroke-width="3" />
  <text x="130" y="296" text-anchor="middle" fill="white" font-size="16" font-family="sans-serif">GND</text>

  <!-- ============ RIGHT: speaker on a PWM pin ============ -->
  <text x="420" y="24" text-anchor="middle" fill="white" font-size="16" font-family="sans-serif">Speaker</text>
  <circle cx="420" cy="46" r="5" fill="rgb(27,212,215)" />
  <text x="386" y="52" text-anchor="end" fill="rgb(27,212,215)" font-size="17" font-family="sans-serif">23</text>
  <line x1="420" y1="46" x2="420" y2="76" stroke="white" stroke-width="3" />

  <!-- current-limiting resistor -->
  <path d="M 420 76 L 402 88 L 438 102 L 402 116 L 438 130 L 420 142" fill="none" stroke="white" stroke-width="3" />
  <text x="350" y="112" text-anchor="end" fill="white" font-size="14" font-family="sans-serif">330&#8486;</text>

  <line x1="420" y1="142" x2="420" y2="176" stroke="white" stroke-width="3" />

  <!-- speaker symbol: driver box plus cone -->
  <rect x="400" y="176" width="40" height="34" fill="none" stroke="white" stroke-width="3" />
  <path d="M 440 176 L 470 162 L 470 224 L 440 210 Z" fill="none" stroke="white" stroke-width="3" />

  <line x1="420" y1="210" x2="420" y2="252" stroke="white" stroke-width="3" />
  <line x1="400" y1="252" x2="440" y2="252" stroke="white" stroke-width="3" />
  <line x1="406" y1="262" x2="434" y2="262" stroke="white" stroke-width="3" />
  <line x1="412" y1="272" x2="428" y2="272" stroke="white" stroke-width="3" />
  <text x="420" y="296" text-anchor="middle" fill="white" font-size="16" font-family="sans-serif">GND</text>

  <text x="280" y="322" text-anchor="middle" fill="rgb(150,150,160)" font-size="14" font-family="sans-serif">More light means less resistance, so covering the photocell makes A2 read lower.</text>
</svg>
