<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="560" height="300" viewBox="0 0 560 300" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Orientation warning: reversing this part makes it get hot -->
  <text x="26" y="42" fill="rgb(255,100,0)" font-size="16" font-family="sans-serif">Check orientation</text>
  <text x="26" y="63" fill="rgb(255,100,0)" font-size="16" font-family="sans-serif">before powering up.</text>
  <text x="26" y="84" fill="rgb(255,100,0)" font-size="16" font-family="sans-serif">Backwards, this part</text>
  <text x="26" y="105" fill="rgb(255,100,0)" font-size="16" font-family="sans-serif">gets hot enough</text>
  <text x="26" y="126" fill="rgb(255,100,0)" font-size="16" font-family="sans-serif">to burn.</text>

  <!-- TMP36 in its TO-92 package: rounded back, flat face -->
  <path d="M 330 108 L 330 78 A 52 40 0 0 1 434 78 L 434 108 Z"
        fill="none" stroke="white" stroke-width="3" />
  <line x1="330" y1="108" x2="434" y2="108" stroke="white" stroke-width="4" />
  <text x="382" y="86" text-anchor="middle" fill="white" font-size="17" font-family="sans-serif">TMP36</text>

  <!-- Leader to the flat face -->
  <line x1="300" y1="126" x2="326" y2="110" stroke="rgb(150,150,160)" stroke-width="2" />
  <text x="296" y="132" text-anchor="end" fill="rgb(150,150,160)" font-size="13" font-family="sans-serif">flat face</text>

  <!-- Three legs -->
  <line x1="352" y1="108" x2="352" y2="196" stroke="white" stroke-width="3" />
  <line x1="382" y1="108" x2="382" y2="252" stroke="white" stroke-width="3" />
  <line x1="412" y1="108" x2="412" y2="196" stroke="white" stroke-width="3" />

  <!-- Left leg to 3V3 -->
  <line x1="352" y1="196" x2="200" y2="196" stroke="white" stroke-width="3" />
  <circle cx="200" cy="196" r="5" fill="rgb(27,212,215)" />
  <text x="186" y="192" text-anchor="end" fill="rgb(27,212,215)" font-size="18" font-family="sans-serif">3V3</text>

  <!-- Right leg to GND -->
  <line x1="412" y1="196" x2="492" y2="196" stroke="white" stroke-width="3" />
  <line x1="492" y1="196" x2="492" y2="210" stroke="white" stroke-width="3" />
  <line x1="474" y1="210" x2="510" y2="210" stroke="white" stroke-width="3" />
  <line x1="480" y1="220" x2="504" y2="220" stroke="white" stroke-width="3" />
  <line x1="486" y1="230" x2="498" y2="230" stroke="white" stroke-width="3" />
  <text x="492" y="254" text-anchor="middle" fill="white" font-size="17" font-family="sans-serif">GND</text>

  <!-- Middle leg is the signal -->
  <circle cx="382" cy="252" r="5" fill="rgb(27,212,215)" />
  <text x="382" y="278" text-anchor="middle" fill="rgb(27,212,215)" font-size="18" font-family="sans-serif">A1  (GPIO 41)</text>
</svg>
