<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="560" height="360" viewBox="0 0 560 360" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <text x="280" y="32" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">HC-SR04 ultrasonic sensor</text>

  <!-- the two transducers, which is what the module looks like -->
  <circle cx="316" cy="80" r="26" fill="none" stroke="white" stroke-width="3" />
  <circle cx="378" cy="80" r="26" fill="none" stroke="white" stroke-width="3" />
  <text x="236" y="85" text-anchor="end" fill="rgb(150,150,160)" font-size="13" font-family="sans-serif">one speaks, one listens</text>

  <rect x="244" y="108" width="206" height="168" rx="8" fill="none" stroke="white" stroke-width="3" />

  <text x="252" y="137" fill="white" font-size="15" font-family="sans-serif">VCC</text>
  <line x1="244" y1="132" x2="204" y2="132" stroke="white" stroke-width="2" />
  <text x="196" y="137" text-anchor="end" fill="rgb(255,210,40)" font-size="15" font-family="sans-serif">3V3</text>
  <text x="252" y="177" fill="white" font-size="15" font-family="sans-serif">Trig</text>
  <line x1="244" y1="172" x2="204" y2="172" stroke="white" stroke-width="2" />
  <text x="196" y="177" text-anchor="end" fill="rgb(27,212,215)" font-size="15" font-family="sans-serif">GPIO 22</text>
  <text x="252" y="217" fill="white" font-size="15" font-family="sans-serif">Echo</text>
  <line x1="244" y1="212" x2="204" y2="212" stroke="white" stroke-width="2" />
  <text x="196" y="217" text-anchor="end" fill="rgb(27,212,215)" font-size="15" font-family="sans-serif">GPIO 20</text>
  <text x="252" y="257" fill="white" font-size="15" font-family="sans-serif">GND</text>
  <line x1="244" y1="252" x2="204" y2="252" stroke="white" stroke-width="2" />
  <text x="196" y="257" text-anchor="end" fill="rgb(255,210,40)" font-size="15" font-family="sans-serif">GND</text>

  <text x="280" y="300" text-anchor="middle" fill="rgb(255,210,40)" font-size="14" font-family="sans-serif">Power it from 3V3, not 5V, so the Echo pin stays at 3.3V.</text>
  <text x="280" y="326" text-anchor="middle" fill="rgb(150,150,160)" font-size="14" font-family="sans-serif">Trig is an output from the board. Echo is an input to it.</text>
  <text x="280" y="348" text-anchor="middle" fill="rgb(150,150,160)" font-size="13" font-family="sans-serif">Sound travels about 0.0343 cm per microsecond, and the echo makes the trip twice.</text>
</svg>
