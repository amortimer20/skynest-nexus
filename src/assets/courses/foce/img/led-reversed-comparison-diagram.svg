<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 560 220" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Correct orientation -->
  <g transform="translate(40,0)">
    <text x="80" y="30" text-anchor="middle" fill="rgb(27,212,215)" font-size="19" font-family="sans-serif">Correct Orientation</text>
    <line x1="0" y1="100" x2="60" y2="100" stroke="white" stroke-width="3" />
    <path d="M 60 75 L 60 125 L 100 100 Z" fill="none" stroke="white" stroke-width="3" />
    <line x1="100" y1="75" x2="100" y2="125" stroke="white" stroke-width="4" />
    <line x1="100" y1="100" x2="160" y2="100" stroke="white" stroke-width="3" />
    <text x="80" y="160" text-anchor="middle" fill="#4caf50" font-size="30" font-family="sans-serif">&#10003;</text>
    <text x="80" y="195" text-anchor="middle" fill="white" font-size="17" font-family="sans-serif">Current flows &#8212; LED lights</text>
  </g>

  <!-- Reversed -->
  <g transform="translate(340,0)">
    <text x="80" y="30" text-anchor="middle" fill="rgb(27,212,215)" font-size="19" font-family="sans-serif">Reversed</text>
    <line x1="0" y1="100" x2="60" y2="100" stroke="white" stroke-width="3" />
    <line x1="60" y1="75" x2="60" y2="125" stroke="white" stroke-width="4" />
    <path d="M 100 75 L 100 125 L 60 100 Z" fill="none" stroke="white" stroke-width="3" />
    <line x1="100" y1="100" x2="160" y2="100" stroke="white" stroke-width="3" />
    <text x="80" y="160" text-anchor="middle" fill="#e05050" font-size="30" font-family="sans-serif">&#10007;</text>
    <text x="80" y="195" text-anchor="middle" fill="white" font-size="17" font-family="sans-serif">No current &#8212; stays dark</text>
  </g>
</svg>
