<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="560" height="300" viewBox="0 0 560 300" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- 3V3 source node -->
  <circle cx="60" cy="60" r="5" fill="rgb(27,212,215)" />
  <text x="30" y="45" fill="rgb(27,212,215)" font-size="18" font-family="sans-serif">3V3</text>
  <line x1="60" y1="60" x2="185" y2="60" stroke="white" stroke-width="3" />

  <!-- Momentary push button (open switch symbol) -->
  <circle cx="185" cy="60" r="4" fill="white" />
  <circle cx="265" cy="60" r="4" fill="white" />
  <line x1="182" y1="54" x2="262" y2="26" stroke="white" stroke-width="3" />
  <line x1="225" y1="39" x2="225" y2="22" stroke="white" stroke-width="2" />
  <line x1="211" y1="22" x2="239" y2="22" stroke="white" stroke-width="2" />
  <text x="225" y="96" text-anchor="middle" fill="white" font-size="16" font-family="sans-serif">button</text>

  <line x1="265" y1="60" x2="400" y2="60" stroke="white" stroke-width="3" />

  <!-- GPIO 33 node -->
  <circle cx="400" cy="60" r="5" fill="rgb(27,212,215)" />
  <text x="418" y="56" fill="rgb(27,212,215)" font-size="18" font-family="sans-serif">GPIO 33</text>
  <text x="418" y="78" fill="rgb(27,212,215)" font-size="14" font-family="sans-serif">Pin.IN</text>

  <line x1="400" y1="60" x2="400" y2="140" stroke="white" stroke-width="3" />

  <!-- What the board does internally when PULL_DOWN is switched on -->
  <rect x="318" y="132" width="164" height="150" rx="10" fill="none"
        stroke="rgb(150,150,160)" stroke-width="2" stroke-dasharray="7 5" />
  <text x="400" y="152" text-anchor="middle" fill="rgb(150,150,160)" font-size="13" font-family="sans-serif">inside the board</text>
  <text x="400" y="169" text-anchor="middle" fill="rgb(150,150,160)" font-size="13" font-family="sans-serif">Pin.PULL_DOWN</text>

  <path d="M 400 176 L 384 186 L 416 198 L 384 210 L 416 222 L 400 232" fill="none" stroke="rgb(150,150,160)" stroke-width="3" />

  <!-- Ground -->
  <line x1="400" y1="232" x2="400" y2="248" stroke="rgb(150,150,160)" stroke-width="3" />
  <line x1="380" y1="248" x2="420" y2="248" stroke="rgb(150,150,160)" stroke-width="3" />
  <line x1="386" y1="257" x2="414" y2="257" stroke="rgb(150,150,160)" stroke-width="3" />
  <line x1="392" y1="266" x2="408" y2="266" stroke="rgb(150,150,160)" stroke-width="3" />

  <text x="60" y="150" fill="white" font-size="16" font-family="sans-serif">Button open &#8594; the internal</text>
  <text x="60" y="172" fill="white" font-size="16" font-family="sans-serif">resistor holds the pin at 0</text>
  <text x="60" y="204" fill="white" font-size="16" font-family="sans-serif">Button pressed &#8594; 3V3 wins,</text>
  <text x="60" y="226" fill="white" font-size="16" font-family="sans-serif">the pin reads 1</text>
</svg>
