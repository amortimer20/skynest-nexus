<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 560 300" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <marker id="c1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="white" />
    </marker>
  </defs>

  <!-- Top wire: 3.3V -> resistor -> LED -> top-right corner -->
  <line x1="60" y1="60" x2="140" y2="60" stroke="white" stroke-width="3" />
  <path d="M 140 60 L 152 42 L 166 78 L 180 42 L 194 78 L 208 60" fill="none" stroke="white" stroke-width="3" />
  <line x1="208" y1="60" x2="280" y2="60" stroke="white" stroke-width="3" />

  <!-- LED (anode toward resistor, cathode toward corner) -->
  <path d="M 280 35 L 280 85 L 320 60 Z" fill="none" stroke="white" stroke-width="3" />
  <line x1="320" y1="35" x2="320" y2="85" stroke="white" stroke-width="4" />
  <line x1="297" y1="27" x2="311" y2="9" stroke="white" stroke-width="2" marker-end="url(#c1-arrow)" />
  <line x1="313" y1="37" x2="327" y2="19" stroke="white" stroke-width="2" marker-end="url(#c1-arrow)" />

  <line x1="320" y1="60" x2="420" y2="60" stroke="white" stroke-width="3" />

  <!-- Right wire down -->
  <line x1="420" y1="60" x2="420" y2="220" stroke="white" stroke-width="3" />

  <!-- Bottom wire -->
  <line x1="420" y1="220" x2="60" y2="220" stroke="white" stroke-width="3" />

  <!-- Ground, hanging off the bottom wire -->
  <line x1="200" y1="220" x2="200" y2="250" stroke="white" stroke-width="3" />
  <line x1="180" y1="250" x2="220" y2="250" stroke="white" stroke-width="3" />
  <line x1="186" y1="260" x2="214" y2="260" stroke="white" stroke-width="3" />
  <line x1="192" y1="270" x2="208" y2="270" stroke="white" stroke-width="3" />
  <text x="200" y="292" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">GND</text>

  <!-- Left wire up, back to 3.3V -->
  <line x1="60" y1="220" x2="60" y2="60" stroke="white" stroke-width="3" />

  <!-- 3.3V node -->
  <circle cx="60" cy="60" r="5" fill="rgb(27,212,215)" />
  <text x="20" y="45" fill="rgb(27,212,215)" font-size="20" font-family="sans-serif">3.3V</text>

  <text x="280" y="140" text-anchor="middle" fill="white" font-size="17" font-family="sans-serif">Resistor and LED in series, powered directly from the fixed 3.3V pin</text>
</svg>
