<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 900 220" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <marker id="ssr-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="white" />
    </marker>
  </defs>

  <!-- Power Source -->
  <g transform="translate(20,0)">
    <line x1="0" y1="90" x2="55" y2="90" stroke="white" stroke-width="3" />
    <line x1="55" y1="65" x2="55" y2="115" stroke="white" stroke-width="4" />
    <line x1="75" y1="78" x2="75" y2="102" stroke="white" stroke-width="4" />
    <line x1="75" y1="90" x2="140" y2="90" stroke="white" stroke-width="3" />
    <text x="55" y="52" text-anchor="middle" fill="white" font-size="20" font-family="sans-serif">+</text>
    <text x="75" y="135" text-anchor="middle" fill="white" font-size="20" font-family="sans-serif">&#8722;</text>
    <text x="80" y="180" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">Power Source</text>
  </g>

  <!-- Resistor -->
  <g transform="translate(200,0)">
    <line x1="0" y1="90" x2="40" y2="90" stroke="white" stroke-width="3" />
    <path d="M 40 90 L 52 70 L 66 110 L 80 70 L 94 110 L 108 90" fill="none" stroke="white" stroke-width="3" />
    <line x1="108" y1="90" x2="140" y2="90" stroke="white" stroke-width="3" />
    <text x="70" y="180" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">Resistor</text>
  </g>

  <!-- LED -->
  <g transform="translate(380,0)">
    <line x1="0" y1="90" x2="55" y2="90" stroke="white" stroke-width="3" />
    <path d="M 55 65 L 55 115 L 95 90 Z" fill="none" stroke="white" stroke-width="3" />
    <line x1="95" y1="65" x2="95" y2="115" stroke="white" stroke-width="4" />
    <line x1="95" y1="90" x2="140" y2="90" stroke="white" stroke-width="3" />
    <line x1="72" y1="52" x2="86" y2="34" stroke="white" stroke-width="2" marker-end="url(#ssr-arrow)" />
    <line x1="88" y1="62" x2="102" y2="44" stroke="white" stroke-width="2" marker-end="url(#ssr-arrow)" />
    <text x="70" y="180" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">LED</text>
  </g>

  <!-- Switch -->
  <g transform="translate(560,0)">
    <line x1="0" y1="90" x2="46" y2="90" stroke="white" stroke-width="3" />
    <circle cx="50" cy="90" r="4" fill="white" />
    <line x1="50" y1="90" x2="95" y2="58" stroke="white" stroke-width="3" />
    <circle cx="95" cy="90" r="4" fill="white" />
    <line x1="99" y1="90" x2="140" y2="90" stroke="white" stroke-width="3" />
    <text x="70" y="180" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">Switch (Open)</text>
  </g>

  <!-- Ground -->
  <g transform="translate(740,0)">
    <line x1="70" y1="55" x2="70" y2="90" stroke="white" stroke-width="3" />
    <line x1="50" y1="90" x2="90" y2="90" stroke="white" stroke-width="3" />
    <line x1="56" y1="100" x2="84" y2="100" stroke="white" stroke-width="3" />
    <line x1="62" y1="110" x2="78" y2="110" stroke="white" stroke-width="3" />
    <text x="70" y="180" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">Ground</text>
  </g>
</svg>
