<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 700 440" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Board outline -->
  <rect x="10" y="10" width="680" height="420" rx="14" fill="none" stroke="white" stroke-width="3" />

  <!-- Top power rails -->
  <rect x="40" y="28" width="620" height="14" rx="7" fill="#e05050" opacity="0.55" />
  <rect x="40" y="52" width="620" height="14" rx="7" fill="#4a7fd6" opacity="0.55" />
  <text x="20" y="40" fill="#e05050" font-size="16" font-family="sans-serif">+</text>
  <text x="20" y="64" fill="#4a7fd6" font-size="16" font-family="sans-serif">&#8722;</text>
  <text x="360" y="95" text-anchor="middle" fill="white" font-size="16" font-family="sans-serif">Power rails run the entire length of the board</text>

  <!-- Center gap -->
  <line x1="350" y1="130" x2="350" y2="300" stroke="white" stroke-width="2" stroke-dasharray="6,6" />

  <!-- Row 1 -->
  <g>
    <rect x="130" y="143" width="180" height="14" rx="7" fill="#e8a33d" opacity="0.5" />
    <rect x="390" y="143" width="180" height="14" rx="7" fill="#e8a33d" opacity="0.5" />
  </g>
  <!-- Row 2 (called out) -->
  <g>
    <rect x="130" y="183" width="180" height="14" rx="7" fill="rgb(27,212,215)" opacity="0.55" />
    <rect x="390" y="183" width="180" height="14" rx="7" fill="rgb(27,212,215)" opacity="0.55" />
  </g>
  <!-- Row 3 -->
  <g>
    <rect x="130" y="223" width="180" height="14" rx="7" fill="#8a5fd6" opacity="0.5" />
    <rect x="390" y="223" width="180" height="14" rx="7" fill="#8a5fd6" opacity="0.5" />
  </g>

  <!-- Dots for rows 1-3, both sides of gap -->
  <g fill="white">
    <circle cx="150" cy="150" r="4" /><circle cx="190" cy="150" r="4" /><circle cx="230" cy="150" r="4" /><circle cx="270" cy="150" r="4" /><circle cx="290" cy="150" r="4" />
    <circle cx="410" cy="150" r="4" /><circle cx="450" cy="150" r="4" /><circle cx="490" cy="150" r="4" /><circle cx="530" cy="150" r="4" /><circle cx="550" cy="150" r="4" />

    <circle cx="150" cy="190" r="4" /><circle cx="190" cy="190" r="4" /><circle cx="230" cy="190" r="4" /><circle cx="270" cy="190" r="4" /><circle cx="290" cy="190" r="4" />
    <circle cx="410" cy="190" r="4" /><circle cx="450" cy="190" r="4" /><circle cx="490" cy="190" r="4" /><circle cx="530" cy="190" r="4" /><circle cx="550" cy="190" r="4" />

    <circle cx="150" cy="230" r="4" /><circle cx="190" cy="230" r="4" /><circle cx="230" cy="230" r="4" /><circle cx="270" cy="230" r="4" /><circle cx="290" cy="230" r="4" />
    <circle cx="410" cy="230" r="4" /><circle cx="450" cy="230" r="4" /><circle cx="490" cy="230" r="4" /><circle cx="530" cy="230" r="4" /><circle cx="550" cy="230" r="4" />
  </g>

  <!-- Callout for row 2, stacked (not side-by-side, to avoid overlap) -->
  <text x="350" y="270" text-anchor="middle" fill="rgb(27,212,215)" font-size="16" font-family="sans-serif">These 5 holes are all connected to each other&#8230;</text>
  <text x="350" y="292" text-anchor="middle" fill="rgb(27,212,215)" font-size="16" font-family="sans-serif">&#8230;but not to these 5, or to the rows above/below</text>

  <!-- Center gap label, clear of both the rows above and the rails below -->
  <text x="350" y="330" text-anchor="middle" fill="white" font-size="15" font-family="sans-serif">Center gap</text>
  <text x="350" y="348" text-anchor="middle" fill="white" font-size="15" font-family="sans-serif">(not connected across)</text>

  <!-- Bottom power rails -->
  <rect x="40" y="374" width="620" height="14" rx="7" fill="#e05050" opacity="0.55" />
  <rect x="40" y="398" width="620" height="14" rx="7" fill="#4a7fd6" opacity="0.55" />
  <text x="20" y="386" fill="#e05050" font-size="16" font-family="sans-serif">+</text>
  <text x="20" y="410" fill="#4a7fd6" font-size="16" font-family="sans-serif">&#8722;</text>
</svg>
