<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="560" height="400" viewBox="0 0 560 400" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <text x="280" y="34" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">TB6612FNG motor driver</text>
  <text x="280" y="56" text-anchor="middle" fill="rgb(150,150,160)" font-size="14" font-family="sans-serif">board pins on the left, power and motors on the right</text>

  <rect x="204" y="76" width="160" height="232" rx="8" fill="none" stroke="white" stroke-width="3" />

  <text x="212" y="101" fill="white" font-size="13" font-family="sans-serif">PWMA</text>
  <line x1="204" y1="96" x2="176" y2="96" stroke="white" stroke-width="2" />
  <text x="170" y="101" text-anchor="end" fill="rgb(27,212,215)" font-size="14" font-family="sans-serif">33</text>
  <text x="212" y="133" fill="white" font-size="13" font-family="sans-serif">AIN2</text>
  <line x1="204" y1="128" x2="176" y2="128" stroke="white" stroke-width="2" />
  <text x="170" y="133" text-anchor="end" fill="rgb(27,212,215)" font-size="14" font-family="sans-serif">32</text>
  <text x="212" y="165" fill="white" font-size="13" font-family="sans-serif">AIN1</text>
  <line x1="204" y1="160" x2="176" y2="160" stroke="white" stroke-width="2" />
  <text x="170" y="165" text-anchor="end" fill="rgb(27,212,215)" font-size="14" font-family="sans-serif">31</text>
  <text x="212" y="197" fill="white" font-size="13" font-family="sans-serif">STBY</text>
  <line x1="204" y1="192" x2="176" y2="192" stroke="white" stroke-width="2" />
  <text x="170" y="197" text-anchor="end" fill="rgb(255,210,40)" font-size="14" font-family="sans-serif">3V3</text>
  <text x="212" y="229" fill="white" font-size="13" font-family="sans-serif">BIN1</text>
  <line x1="204" y1="224" x2="176" y2="224" stroke="white" stroke-width="2" />
  <text x="170" y="229" text-anchor="end" fill="rgb(27,212,215)" font-size="14" font-family="sans-serif">21</text>
  <text x="212" y="261" fill="white" font-size="13" font-family="sans-serif">BIN2</text>
  <line x1="204" y1="256" x2="176" y2="256" stroke="white" stroke-width="2" />
  <text x="170" y="261" text-anchor="end" fill="rgb(27,212,215)" font-size="14" font-family="sans-serif">35</text>
  <text x="212" y="293" fill="white" font-size="13" font-family="sans-serif">PWMB</text>
  <line x1="204" y1="288" x2="176" y2="288" stroke="white" stroke-width="2" />
  <text x="170" y="293" text-anchor="end" fill="rgb(27,212,215)" font-size="14" font-family="sans-serif">34</text>
  <text x="356" y="101" text-anchor="end" fill="white" font-size="13" font-family="sans-serif">VM</text>
  <line x1="364" y1="96" x2="392" y2="96" stroke="white" stroke-width="2" />
  <text x="398" y="101" fill="rgb(255,210,40)" font-size="14" font-family="sans-serif">battery +</text>
  <text x="356" y="133" text-anchor="end" fill="white" font-size="13" font-family="sans-serif">VCC</text>
  <line x1="364" y1="128" x2="392" y2="128" stroke="white" stroke-width="2" />
  <text x="398" y="133" fill="rgb(255,210,40)" font-size="14" font-family="sans-serif">3V3</text>
  <text x="356" y="165" text-anchor="end" fill="white" font-size="13" font-family="sans-serif">GND</text>
  <line x1="364" y1="160" x2="392" y2="160" stroke="white" stroke-width="2" />
  <text x="398" y="165" fill="rgb(255,210,40)" font-size="14" font-family="sans-serif">GND</text>
  <text x="356" y="197" text-anchor="end" fill="white" font-size="13" font-family="sans-serif">AO1</text>
  <line x1="364" y1="192" x2="392" y2="192" stroke="white" stroke-width="2" />
  <text x="398" y="197" fill="white" font-size="14" font-family="sans-serif">right motor</text>
  <text x="356" y="229" text-anchor="end" fill="white" font-size="13" font-family="sans-serif">AO2</text>
  <line x1="364" y1="224" x2="392" y2="224" stroke="white" stroke-width="2" />
  <text x="398" y="229" fill="white" font-size="14" font-family="sans-serif">right motor</text>
  <text x="356" y="261" text-anchor="end" fill="white" font-size="13" font-family="sans-serif">BO1</text>
  <line x1="364" y1="256" x2="392" y2="256" stroke="white" stroke-width="2" />
  <text x="398" y="261" fill="white" font-size="14" font-family="sans-serif">left motor</text>
  <text x="356" y="293" text-anchor="end" fill="white" font-size="13" font-family="sans-serif">BO2</text>
  <line x1="364" y1="288" x2="392" y2="288" stroke="white" stroke-width="2" />
  <text x="398" y="293" fill="white" font-size="14" font-family="sans-serif">left motor</text>

  <text x="280" y="352" text-anchor="middle" fill="rgb(255,210,40)" font-size="14" font-family="sans-serif">STBY must be HIGH or the driver stays asleep.</text>
  <text x="280" y="374" text-anchor="middle" fill="rgb(255,210,40)" font-size="14" font-family="sans-serif">The battery pack feeds VM. Never the 3V3 rail.</text>
  <text x="280" y="394" text-anchor="middle" fill="rgb(150,150,160)" font-size="13" font-family="sans-serif">Board GND and battery &#8722; must both connect to the driver&#39;s GND.</text>
</svg>
