<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="560" height="290" viewBox="0 0 560 290" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <marker id="pot-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgb(27,212,215)" />
    </marker>
  </defs>

  <!-- 3V3 at the top of the resistive track -->
  <circle cx="280" cy="38" r="5" fill="rgb(27,212,215)" />
  <text x="280" y="22" text-anchor="middle" fill="rgb(27,212,215)" font-size="18" font-family="sans-serif">3V3</text>
  <line x1="280" y1="38" x2="280" y2="70" stroke="white" stroke-width="3" />

  <!-- Resistive track -->
  <path d="M 280 70 L 262 82 L 298 96 L 262 110 L 298 124 L 262 138 L 298 152 L 280 164"
        fill="none" stroke="white" stroke-width="3" />
  <text x="150" y="122" fill="white" font-size="17" font-family="sans-serif">10K pot</text>

  <!-- GND at the bottom of the track -->
  <line x1="280" y1="164" x2="280" y2="196" stroke="white" stroke-width="3" />
  <line x1="260" y1="196" x2="300" y2="196" stroke="white" stroke-width="3" />
  <line x1="266" y1="206" x2="294" y2="206" stroke="white" stroke-width="3" />
  <line x1="272" y1="216" x2="288" y2="216" stroke="white" stroke-width="3" />
  <text x="280" y="240" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">GND</text>

  <!-- Wiper: the middle leg, which moves when the knob turns -->
  <line x1="400" y1="117" x2="308" y2="117" stroke="rgb(27,212,215)" stroke-width="3" marker-end="url(#pot-arrow)" />
  <line x1="400" y1="117" x2="430" y2="117" stroke="rgb(27,212,215)" stroke-width="3" />
  <circle cx="430" cy="117" r="5" fill="rgb(27,212,215)" />
  <text x="448" y="113" fill="rgb(27,212,215)" font-size="18" font-family="sans-serif">A0</text>
  <text x="448" y="134" fill="rgb(27,212,215)" font-size="14" font-family="sans-serif">GPIO 40</text>
  <text x="330" y="100" fill="rgb(150,150,160)" font-size="14" font-family="sans-serif">wiper (middle leg)</text>

  <text x="280" y="272" text-anchor="middle" fill="rgb(150,150,160)" font-size="15" font-family="sans-serif">The five-LED array from Activity 2.6 stays wired, unchanged.</text>
</svg>
